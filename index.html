<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>The Debt Spiral</title>
<style>
 *{box-sizing:border-box}
 body{margin:0;background:#fff;color:#3C4842;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
 .wrap{display:flex;align-items:flex-start;min-height:100vh;min-height:100dvh}
 .left{flex:1 1 62%;min-width:0;padding:24px 20px 60px}
 .mapbox{overflow-x:auto;-webkit-overflow-scrolling:touch}
 .right{flex:0 0 38%;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;
   border-left:1px solid #E2E7E3;background:#FCFDFC;padding:26px 26px 30px;
   display:flex;flex-direction:column;min-width:0}
 svg#map{display:block;width:100%;height:auto;max-width:1160px;margin:0 auto}
 .ln{stroke:#44546B;stroke-width:2.4;fill:none;marker-end:url(#ah)}
 .lnr{stroke:#A63A2E;stroke-width:3;fill:none;marker-end:url(#ahr)}
 g.hot{cursor:pointer}
 g.hot rect:first-of-type{transition:filter .12s}
 g.hot .chip-bg{transition:filter .15s}
 @media(hover:hover){
   g.hot:hover rect:first-of-type{filter:brightness(.97)}
   g.hot:hover .chip-bg{filter:brightness(1.18)}
 }
 g.hot.on rect:first-of-type{stroke-width:4.5}
 g.hot.on .chip-bg{filter:brightness(.82)}
 .ph{margin:auto;text-align:center;color:#A9B4AE;max-width:250px}
 .ch-h{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#8F9BA8;text-transform:uppercase}
 .ch-t{font-size:21px;font-weight:800;color:#141C26;letter-spacing:-.3px;margin:16px 0 2px}
 .ch-v{font-size:32px;font-weight:800;color:#141C26;letter-spacing:-1px;font-variant-numeric:tabular-nums}
 .ch-v span{font-size:13px;font-weight:600;color:#8F9BA8;margin-left:8px;letter-spacing:0}
 .ch-r{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;padding:3px 9px;
   border-radius:99px;margin-top:8px}
 .r-hard{background:#EAF3ED;color:#2F6B45} .r-soft{background:#F3F6FA;color:#27456B}
 .ch-n{font-size:13.5px;color:#63707F;margin:12px 0 0;border-left:3px solid #2F6B45;padding-left:12px}
 .ch-s{flex:none;padding-top:20px;font-size:11.5px;color:#A9B4AE}
 svg.chart{flex:none;width:100%;max-width:100%;min-width:0;height:auto;margin-top:10px}
 #pane>svg{flex:none;width:100%;max-width:100%;min-width:0;height:auto}
 .ch-gap{flex:1 1 0;min-height:26px;max-height:120px}
 .ch-fill{flex:1 1 0;min-height:0}
 @media(max-width:1000px){
   .wrap{display:block}
   .left{padding:16px 14px 28px}
   .right{position:static;height:auto;border-left:0;border-top:1px solid #E2E7E3;padding:22px 18px 28px}
   .mapbox svg#map{min-width:0}
   .ch-gap{flex:none;height:34px;max-height:none}
   .ch-fill{display:none}
 }
 @media(max-width:620px){
   body{font-size:14px}
   .mapbox svg#map{min-width:720px}
   .right{padding:18px 14px 24px}
   .ch-t{font-size:19px;margin-top:14px} .ch-v{font-size:27px}
   .ch-n{font-size:13px}
 }
</style></head><body>
<div class="wrap">
 <div class="left"><div class="mapbox"><svg id="map" viewBox="0 0 1160 1104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44546B"/></marker></defs>
<rect width="1160" height="1104" fill="#fff"/>
<text x="580" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#141C26" letter-spacing="-0.6">The Debt Spiral</text>
<text x="580" y="88" text-anchor="middle" font-size="15" fill="#63707F">The elephant in every financial room</text>
<rect class="chip-bg" x="434" y="103" width="97" height="20" rx="10" fill="#0F6FE8" fill-opacity="1" stroke="#0F6FE8" stroke-width="1.1"/><text class="chip-tx" x="483" y="116" text-anchor="middle" font-size="9" font-weight="800" letter-spacing="1" fill="#fff">SEE THE DATA</text><text x="541" y="117" font-size="13" fill="#8F9BA8">Click anything with this tag</text>
<g>
<rect x="270" y="178" width="620" height="54" rx="11" fill="#F0F2F5" stroke="#5B6B7D" stroke-width="2.6"/>
<text x="580" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#141C26">The money supply can be expanded at will</text>
</g>
<path class="ln" d="M580,232 L580,281"/>
<g class="hot" data-chart="spend|deficit">
<rect x="270" y="283" width="620" height="92" rx="11" fill="#F3F6FA" stroke="#27456B" stroke-width="2.6"/>
<text x="580" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#1B3252">So the government overspends</text>
<text x="580" y="336" text-anchor="middle" font-size="12.5" fill="#73808F">It runs out of money about every 9 months</text>
<text x="580" y="355" text-anchor="middle" font-size="12.5" fill="#73808F">But it knows The Fed can just create more</text>
<rect class="chip-bg" x="781" y="294" width="97" height="20" rx="10" fill="#0F6FE8" fill-opacity="1" stroke="#0F6FE8" stroke-width="1.1"/><text class="chip-tx" x="829" y="307" text-anchor="middle" font-size="9" font-weight="800" letter-spacing="1" fill="#fff">SEE THE DATA</text>
</g>
<g class="hot" data-chart="x:mechanism"><rect class="chip-bg" x="201" y="425" width="238" height="30" rx="15" fill="#5B6B7D"/><text x="320" y="445" text-anchor="middle" font-size="15" fill="#fff">So the Fed prints more money</text></g>
<g class="hot" data-chart="x:mechanism"><rect class="chip-bg" x="699" y="425" width="281" height="30" rx="15" fill="#5B6B7D"/><text x="840" y="445" text-anchor="middle" font-size="15" fill="#fff">And the government borrows money</text></g>
<path class="ln" d="M580,375 L580,457 L320,457 L320,510"/>
<path class="ln" d="M580,375 L580,457 L840,457 L840,510"/>

<g class="hot" data-chart="debt|service">
<rect x="590" y="512" width="500" height="92" rx="11" fill="#F3F6FA" stroke="#27456B" stroke-width="2.6"/>
<text x="840" y="546" text-anchor="middle" font-size="16" font-weight="700" fill="#1B3252">Debt piles up</text>
<text x="840" y="565" text-anchor="middle" font-size="12.5" fill="#73808F">Federal debt is up 9,975% since 1971</text>
<text x="840" y="584" text-anchor="middle" font-size="12.5" fill="#73808F">The cost to service it is up 3,583% since 1971</text>
<rect class="chip-bg" x="981" y="523" width="97" height="20" rx="10" fill="#0F6FE8" fill-opacity="1" stroke="#0F6FE8" stroke-width="1.1"/><text class="chip-tx" x="1029" y="536" text-anchor="middle" font-size="9" font-weight="800" letter-spacing="1" fill="#fff">SEE THE DATA</text>
</g>
<g class="hot" data-chart="m2|pp">
<rect x="70" y="512" width="500" height="92" rx="11" fill="#F3F6FA" stroke="#27456B" stroke-width="2.6"/>
<text x="320" y="546" text-anchor="middle" font-size="16" font-weight="700" fill="#1B3252">Money supply piles up</text>
<text x="320" y="565" text-anchor="middle" font-size="12.5" fill="#73808F">The M2 money supply is up 3,588% since 1971</text>
<text x="320" y="584" text-anchor="middle" font-size="12.5" fill="#73808F">The dollar has lost 97% since 1913, when the Fed was created</text>
<rect class="chip-bg" x="461" y="523" width="97" height="20" rx="10" fill="#0F6FE8" fill-opacity="1" stroke="#0F6FE8" stroke-width="1.1"/><text class="chip-tx" x="509" y="536" text-anchor="middle" font-size="9" font-weight="800" letter-spacing="1" fill="#fff">SEE THE DATA</text>
</g>


<rect x="110" y="652" width="940" height="420" rx="13" fill="#F2F7F3" stroke="#2F6B45" stroke-width="2.6"/>
<text x="140" y="692" font-size="12" font-weight="800" fill="#2F6B45" letter-spacing="1.8">HOW TO POSITION</text>
<rect x="168" y="718" width="53" height="31" rx="15.5" fill="#2F6B45"/>
<text x="194" y="739" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" letter-spacing="2.2">DO</text>
<circle cx="212" cy="775" r="8.5" fill="#2F6B45"/>
<text x="212" y="779" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">✓</text>
<text x="234" y="780" font-size="17" font-weight="800" fill="#1C3F2A">Hold long-term fixed debt, not variable</text>
<text x="252" y="800" font-size="13.5" fill="#63707F">The payment never changes, but the real cost diminishes. A variable rate resets with inflation.</text>
<circle cx="212" cy="831" r="8.5" fill="#2F6B45"/>
<text x="212" y="835" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">✓</text>
<text x="234" y="836" font-size="17" font-weight="800" fill="#1C3F2A">Own assets that outperform the real hurdle rate</text>
<text x="252" y="856" font-size="13.5" fill="#63707F">M2 increases an average of 6.7% a year. That's the real hurdle rate on all investments.</text>
<rect x="168" y="900" width="88" height="31" rx="15.5" fill="#A33A2A"/>
<text x="212" y="921" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" letter-spacing="2.2">DON'T</text>
<circle cx="212" cy="957" r="8.5" fill="#A33A2A"/>
<text x="212" y="961" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">✕</text>
<text x="234" y="962" font-size="17" font-weight="800" fill="#1C3F2A">Don't hold cash or bonds</text>
<text x="252" y="982" font-size="13.5" fill="#63707F">Cash melts away. Bonds rarely keep up with inflation, you just lose less.</text>
<circle cx="212" cy="1013" r="8.5" fill="#A33A2A"/>
<text x="212" y="1017" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">✕</text>
<text x="234" y="1018" font-size="17" font-weight="800" fill="#1C3F2A">Don't expect the gov. overspending problem to be solved</text>
<text x="252" y="1038" font-size="13.5" fill="#63707F">Most spending is Social Security and Medicare. It grows as people age.</text>
</svg></div></div>

    +'<div class="ch-fill"></div><div class="ch-s">Source: FRED, Federal Reserve Bank of St. Louis</div>';};
  let H=keys.length>1?170:290;
  render(H);
  // the pane is a fixed-height column on wide screens: shrink the plots to fit it
  if(keys.length>1&&pane.clientHeight>240){
    for(let i=0;i<4;i++){
      const over=pane.scrollHeight-pane.clientHeight;
      if(over<=0||H<=110) break;
      H=Math.max(110,H-Math.ceil(over/keys.length));
      render(H);
    }
  }
}
(function(){const b=document.querySelector('.mapbox');
  const c=()=>{if(b.scrollWidth>b.clientWidth)b.scrollLeft=(b.scrollWidth-b.clientWidth)/2;};
  c(); window.addEventListener('resize',c);})();
document.addEventListener('click',e=>{
  if(e.target.closest('g.hot')||e.target.closest('#pane')) return;
  document.querySelectorAll('g.hot.on').forEach(o=>o.classList.remove('on'));
  pane.innerHTML=PLACEHOLDER;
});
document.querySelectorAll('g.hot').forEach(g=>g.addEventListener('click',()=>{
  document.querySelectorAll('g.hot').forEach(o=>o.classList.remove('on'));
  g.classList.add('on'); draw(g.dataset.chart);
  if(window.matchMedia('(max-width:1000px)').matches)
    pane.scrollIntoView({behavior:'smooth',block:'start'});
}));
